name: Check KTM seats

on:
  schedule:
    - cron: "*/15 * * * *"   # every 5 minutes (GitHub may run it a bit later than this)
  workflow_dispatch:         # lets you press "Run workflow" by hand

permissions:
  contents: write            # so it can save what it saw last time (state.json)

concurrency:
  group: ktm-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check seats
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
                run: python ktm_watch.py --minutes 45 --state state.json

      - name: Keep screenshots if the page couldn't be read
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Save state
        if: always()
        run: |
          if [ -f state.json ] && [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "ktm-bot"
            git config user.email "ktm-bot@users.noreply.github.com"
            git add state.json
            git commit -m "update seat state" -q
            git pull --rebase -q && git push -q || echo "state not saved this time"
          fi
