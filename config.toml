# ---------------------------------------------------------------
# KTM Shuttle Tebrau seat watcher — settings
# Edit this file on GitHub (pencil icon) and commit. The next check uses it.
# ---------------------------------------------------------------

# Your Telegram bot token and chat id are NOT kept here.
# They go in GitHub: Settings > Secrets and variables > Actions
#   TELEGRAM_BOT_TOKEN  and  TELEGRAM_CHAT_ID
[telegram]

[settings]
passengers = 1               # alert only when at least this many seats are free
date_format = "%d %b %Y"     # how dates are typed into the KTMB form (27 Sep 2026)

# ---------------------------------------------------------------
# Trips to watch. Copy a [[watch]] block for each one.
#   direction: SG_TO_JB  (Woodlands -> JB Sentral)
#              JB_TO_SG  (JB Sentral -> Woodlands)
#   date:      YYYY-MM-DD
#   earliest / latest: only alert for trains departing in this window (24h clock)
# ---------------------------------------------------------------

[[watch]]
direction = "SG_TO_JB"
date      = "2026-10-03"
earliest  = "08:00"
latest    = "12:00"

[[watch]]
direction = "JB_TO_SG"
date      = "2026-10-03"
earliest  = "17:00"
latest    = "22:00"
